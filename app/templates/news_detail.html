{% extends 'base.html' %}

{% block content %}
<article class="news-detail-page">
    <header class="news-detail-header">
        <p class="micro">Development Log</p>
        <h1>{{ post.title }}</h1>
        <time>{{ post.date }}</time>
    </header>

    {% if post.image_url %}
    <figure class="news-detail-media">
        <img src="{{ post.image_url }}" alt="{{ post.image_alt }} preview" loading="eager" decoding="async">
    </figure>
    {% endif %}

    <div class="news-detail-body">
        {% for paragraph in post.body %}
        <p>{{ paragraph }}</p>
        {% endfor %}
        <a class="news-read-button" href="{{ url_for('root.whats_new') }}">프로젝트 안내로 돌아가기</a>
    </div>
</article>
{% endblock %}
