{% extends 'base.html' %}

{% block content %}
<section class="upload-stage">
    <p class="micro">Upload</p>
    <h1>Add new photos<br>to your archive</h1>
    <p>Select multiple images to save them to the PA gallery.</p>

    <form class="upload-form" action="" method="post" enctype="multipart/form-data">
        <label class="upload-field">
            <span>Archive title</span>
            <input type="text" name="photoTitle" placeholder="e.g. Seoul blue hour">
        </label>

        <fieldset class="tag-picker">
            <legend>Photo tag</legend>
            {% for slug, label in photo_tags.items() %}
            <label>
                <input type="radio" name="photoTag" value="{{ slug }}" {% if loop.first %}checked{% endif %}>
                <span>{{ label }}</span>
            </label>
            {% endfor %}
        </fieldset>

        <label class="drop-zone" for="fileImage">
            <span>+</span>
            <strong>Choose photos</strong>
            <small>JPG, PNG, GIF, WEBP</small>
            <input type="file" name="fileImage" id="fileImage" multiple>
        </label>
        <button type="submit" id="send" name="send">Upload</button>
    </form>
</section>
{% endblock %}
