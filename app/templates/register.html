{% extends 'base.html' %}

{% block content %}
<section class="auth-page">
    <a class="auth-logo" href="{{ url_for('root.root') }}">PA</a>
    <h1>Create PA account</h1>

    <form class="auth-form" method="POST" action="{{ url_for('auth.register') }}">
        {% if error %}
        <p class="form-error">{{ error }}</p>
        {% endif %}

        <label>
            <span>ID</span>
            <input type="text" name="username" required>
        </label>
        <label>
            <span>Password</span>
            <input type="password" name="password" required>
        </label>

        <button type="submit">Create account</button>
        <div class="divider"><span>or</span></div>
        <a class="google-button" href="{{ url_for('auth.login') }}">Back to login</a>
    </form>

    <footer>@Copyright PA<br>Photo Archive</footer>
</section>
{% endblock %}
