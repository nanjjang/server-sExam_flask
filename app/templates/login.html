{% extends 'base.html' %}

{% block content %}
<h2>로그인</h2>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<form method="POST" action="/auth/login">
    <div>
        <label>아이디</label><br>
        <input type="text" name="username" required>
    </div>
    <div>
        <label>비밀번호</label><br>
        <input type="password" name="password" required>
    </div>
    <br>
    <button type="submit">로그인</button>
    <a href="/auth/register">회원가입</a>
</form>
{% endblock %}
